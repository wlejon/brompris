name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# brompris speaks MPRIS2 over D-Bus on Linux through brodbus, checked out
# beside the repo as a sibling; Windows and macOS build with no backend yet.
# The tests talk to players they host themselves on a private bus. The binding
# (brompris_api) binds bronze, so every job lays out ../bronze and ../brass
# with bronze's checkout-toolchain action.
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc,          os: ubuntu-24.04, config: Release }
          - { name: windows-msvc,       os: windows-2022, config: Release }
          # Debug CRT: iterator debugging and the library's own assert()s.
          - { name: windows-msvc-debug, os: windows-2022, config: Debug }
          - { name: macos-arm64,        os: macos-15,     config: Release }
    steps:
      - uses: actions/checkout@v7
        with:
          path: brompris

      - uses: actions/checkout@v7
        with:
          repository: wlejon/brodbus
          path: brodbus

      - uses: wlejon/bronze/.github/actions/checkout-toolchain@main

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libsystemd-dev dbus

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S brompris -B build
          else
            cmake -S brompris -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          fi

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
